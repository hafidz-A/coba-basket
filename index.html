<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="container-score">
                <div >
                    <h2>Home</h2>
                    <div class="scoreboard" id="score-home">
                        0
                    </div>
                    <ul class="pointing">
                        <button id="point-one-home" onclick="addOneHome()">
                            +1
                        </button>
                        <button id="point-two-home" onclick="addTwoHome()">
                            +2
                        </button>
                        <button id="point-three-home" onclick="addThreeHome()">
                            +3
                        </button>
                    </ul>
                </div>
                <div>
                    <h2>Guest</h2>
                    <div class="scoreboard" id="score-guest">
                        0
                    </div>
                    <ul class="pointing">
                        <button id="point-one-home" onclick="addOneGuest()">
                            +1
                        </button>
                        <button id="point-two-home" onclick="addTwoGuest()">
                            +2
                        </button>
                        <button id="point-three-home" onclick="addThreeGuest()">
                            +3
                        </button>
                    </ul>
                </div>
            </div>
            <button id="new-game" onclick="newGame()">
                New Game
            </button>
        </div>


    </body>
    <script src="index.js"></script>
</html>
